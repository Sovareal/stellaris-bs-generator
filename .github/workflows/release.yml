name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Make gradlew executable
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: ./frontend
          tagName: ${{ github.ref_name }}
          releaseName: Stellaris BS Generator ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            ## Stellaris BS Generator ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.

            ### Installation

            Download the installer for your platform below.

            > **Note:** These installers are unsigned. Windows and macOS will show a security warning on first launch.
            > - **Windows:** Click "More info" then "Run anyway"
            > - **macOS:** Right-click the app and choose "Open", then confirm
